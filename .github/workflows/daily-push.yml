name: Günlük portföy bildirimi

# Her işlem günü 18:00 (TR) portföyün günlük değişimini telefona gönderir.
# GitHub sırası yoğunken çalışma saatlerce gecikebilir ya da hiç başlamayabilir.
# Bu yüzden iş öğlen 13:00'te başlar ve 18:00'e kadar hazır bekler (14:30 ve 17:45
# başlangıçları ilk çalışma kaçarsa devreye girer). 18:20, 19:00 ve 19:45'teki yedek
# çalışmalar bugünün bildirimi gönderilmediyse gönderir, gönderildiyse hiçbir şey yapmaz.
on:
  schedule:
    - cron: '0 10 * * 1-5'    # hazırlık: 13:00 TR, 18:00'e kadar bekler
    - cron: '30 11 * * 1-5'   # hazırlık: 14:30 TR (ilki başlamazsa)
    - cron: '45 14 * * 1-5'   # hazırlık: 17:45 TR
    - cron: '20 15 * * 1-5'   # yedek: 18:20 TR
    - cron: '0 16 * * 1-5'    # yedek: 19:00 TR
    - cron: '45 16 * * 1-5'   # yedek: 19:45 TR
  workflow_dispatch:
    inputs:
      force:
        description: 'Hemen gönder (hafta sonu / saat beklemeden deneme)'
        type: boolean
        default: true

permissions:
  contents: read

# Aynı anda tek çalışma: yedek, ana çalışma bitene kadar sırada bekler ve
# başladığında işareti görür.
concurrency:
  group: gunluk-bildirim
  cancel-in-progress: false

jobs:
  bildirim:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # 13:00'te başlayıp 18:00'e kadar bekleyebilmesi için
    steps:
      - name: Bugünün tarihi (TR)
        id: gun
        run: echo "tarih=$(TZ=Europe/Istanbul date +%F)" >> "$GITHUB_OUTPUT"
      - name: Bugün gönderildi mi?
        id: isaret
        uses: actions/cache/restore@v4
        with:
          path: push-sent.flag
          key: push-sent-${{ steps.gun.outputs.tarih }}
      - name: Zaten gönderildi
        if: steps.isaret.outputs.cache-hit == 'true' && github.event_name == 'schedule'
        run: echo "Bugünün bildirimi daha önce gönderildi; yedek çalışma bir şey yapmıyor."
      - uses: actions/checkout@v4
        if: steps.isaret.outputs.cache-hit != 'true' || github.event_name != 'schedule'
      - uses: actions/setup-python@v5
        if: steps.isaret.outputs.cache-hit != 'true' || github.event_name != 'schedule'
        with:
          python-version: '3.12'
      - run: pip install requests pywebpush
        if: steps.isaret.outputs.cache-hit != 'true' || github.event_name != 'schedule'
      - name: Bildirimi gönder
        if: steps.isaret.outputs.cache-hit != 'true' || github.event_name != 'schedule'
        env:
          SUPABASE_URL: https://jqmfvinbzgqyitqquzdc.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          FORCE_SEND: ${{ github.event.inputs.force || 'false' }}
          PYTHONIOENCODING: utf-8
        run: python scripts/daily_push.py
      - name: Gönderildi işaretini kaydet
        if: steps.isaret.outputs.cache-hit != 'true' && hashFiles('push-sent.flag') != ''
        uses: actions/cache/save@v4
        with:
          path: push-sent.flag
          key: push-sent-${{ steps.gun.outputs.tarih }}
