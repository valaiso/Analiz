name: Günlük portföy bildirimi

# Her işlem günü 18:00 (TR) portföyün günlük değişimini telefona gönderir.
# GitHub'ın kendi zamanlayıcısı 19.10.2026'dan beri çalışmaların çoğunu düşürüyor; bu yüzden
# iş ayrıca Supabase'deki zamanlayıcıdan (supabase/github-cron.sql) "mod: otomatik" ile
# tetiklenir. İki kaynak da aynı kuralları izler:
# - İş öğlen başlar ve 18:00'e kadar hazır bekler; sonraki hazırlıklar ilki kaçarsa devreye girer.
# - 18:00'den sonraki yedekler bildirim gönderilmediyse gönderir, gönderildiyse hiçbir şey yapmaz.
# - Betik yalnızca 12:00-21:00 (TR) arasında gönderir: gece başlayan geciken bir iş ertesi günün
#   işaretini alamaz.
# - 21:37'deki bekçi, o gün bildirim gitmediyse işi başarısız sayar; GitHub bunu e-postayla bildirir.
# Saatler saat başı/buçuk yerine "tek" dakikalardadır (en çok atlanan dakikalar onlar).
on:
  schedule:
    - cron: '7 10 * * 1-5'    # hazırlık: 13:07 TR, 18:00'e kadar bekler
    - cron: '41 11 * * 1-5'   # hazırlık: 14:41 TR
    - cron: '17 13 * * 1-5'   # hazırlık: 16:17 TR
    - cron: '47 14 * * 1-5'   # hazırlık: 17:47 TR
    - cron: '13 15 * * 1-5'   # yedek: 18:13 TR
    - cron: '43 15 * * 1-5'   # yedek: 18:43 TR
    - cron: '19 16 * * 1-5'   # yedek: 19:19 TR
    - cron: '53 16 * * 1-5'   # yedek: 19:53 TR
    - cron: '29 17 * * 1-5'   # yedek: 20:29 TR
    - cron: '37 18 * * 1-5'   # bekçi: 21:37 TR, göndermez; bildirim gitmediyse uyarır
  workflow_dispatch:
    inputs:
      mod:
        description: 'deneme = hemen gönder (işaret bırakmaz) · otomatik = zamanlanmış gibi · bekci = yalnızca kontrol'
        type: choice
        options: [deneme, otomatik, bekci]
        default: deneme

permissions:
  contents: read

# Aynı anda tek çalışma: yedek, ana çalışma bitene kadar sırada bekler ve
# başladığında işareti görür.
concurrency:
  group: gunluk-bildirim
  cancel-in-progress: false

jobs:
  bildirim:
    runs-on: ubuntu-latest
    timeout-minutes: 350   # 13:00'te başlayıp 18:00'e kadar bekleyebilmesi için
    steps:
      - name: Çalışma türü ve bugünün tarihi (TR)
        id: gun
        env:
          OLAY: ${{ github.event_name }}
          ZAMAN: ${{ github.event.schedule }}
          MOD: ${{ github.event.inputs.mod }}
        run: |
          # otomatik: GitHub zamanlayıcısı ya da dış zamanlayıcı; deneme: elle, hemen gönder
          if [ "$OLAY" = "schedule" ] || [ "$MOD" = "otomatik" ] || [ "$MOD" = "bekci" ]; then otomatik=true; else otomatik=false; fi
          if [ "$ZAMAN" = "37 18 * * 1-5" ] || [ "$MOD" = "bekci" ]; then bekci=true; else bekci=false; fi
          tarih=$(TZ=Europe/Istanbul date +%F)
          saat=$(TZ=Europe/Istanbul date +%-H)
          erken=false
          if [ "$bekci" = "true" ]; then
            # Bekçi gecikip gece yarısından sonra başlarsa (20.10'da 00:50'de oldu) dünü denetler;
            # 21:00'den önce başlarsa gönderim hâlâ sürüyor olabilir, hüküm vermez.
            if [ "$saat" -lt 12 ]; then tarih=$(TZ=Europe/Istanbul date -d 'yesterday' +%F)
            elif [ "$saat" -lt 21 ]; then erken=true; fi
          fi
          echo "otomatik=$otomatik" >> "$GITHUB_OUTPUT"
          echo "bekci=$bekci" >> "$GITHUB_OUTPUT"
          echo "erken=$erken" >> "$GITHUB_OUTPUT"
          echo "tarih=$tarih" >> "$GITHUB_OUTPUT"
          echo "tür: otomatik=$otomatik bekçi=$bekci denetlenen gün=$tarih erken=$erken"
      - name: Bugün gönderildi mi?
        id: isaret
        uses: actions/cache/restore@v4
        with:
          path: push-sent.flag
          key: push-sent-${{ steps.gun.outputs.tarih }}
      - name: Zaten gönderildi
        if: steps.isaret.outputs.cache-hit == 'true' && steps.gun.outputs.otomatik == 'true'
        run: echo "Bugünün bildirimi daha önce gönderildi; bu çalışma bir şey yapmıyor."
      - name: Bekçi
        if: steps.gun.outputs.bekci == 'true'
        env:
          GONDERILDI: ${{ steps.isaret.outputs.cache-hit }}
          ERKEN: ${{ steps.gun.outputs.erken }}
          TARIH: ${{ steps.gun.outputs.tarih }}
        run: |
          if [ "$ERKEN" = "true" ]; then echo "21:00'den önce; gönderim sürüyor olabilir, denetim yapılmadı."; exit 0; fi
          if [ "$GONDERILDI" = "true" ]; then echo "$TARIH bildirimi gönderilmiş."; exit 0; fi
          if [ "$(date -d "$TARIH" +%u)" -ge 6 ]; then echo "Hafta sonu; bildirim beklenmiyor."; exit 0; fi
          echo "::error::Bugünün günlük portföy bildirimi gönderilemedi (çalışmalar atlanmış ya da hata olmuş). Actions > Günlük portföy bildirimi > Run workflow ile elle gönderilebilir."
          exit 1
      - name: Gönderim gerekli mi?
        id: gerek
        env:
          OTOMATIK: ${{ steps.gun.outputs.otomatik }}
          BEKCI: ${{ steps.gun.outputs.bekci }}
          GONDERILDI: ${{ steps.isaret.outputs.cache-hit }}
        run: |
          if [ "$OTOMATIK" != "true" ]; then gonder=true
          elif [ "$BEKCI" = "true" ] || [ "$GONDERILDI" = "true" ]; then gonder=false
          else gonder=true; fi
          echo "gonder=$gonder" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        if: steps.gerek.outputs.gonder == 'true'
      - uses: actions/setup-python@v5
        if: steps.gerek.outputs.gonder == 'true'
        with:
          python-version: '3.12'
      - run: pip install requests pywebpush
        if: steps.gerek.outputs.gonder == 'true'
      - name: Bildirimi gönder
        if: steps.gerek.outputs.gonder == 'true'
        env:
          SUPABASE_URL: https://jqmfvinbzgqyitqquzdc.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          FORCE_SEND: ${{ steps.gun.outputs.otomatik == 'true' && 'false' || 'true' }}
          PYTHONIOENCODING: utf-8
        run: python scripts/daily_push.py
      - name: Gönderildi işaretini kaydet
        if: steps.gerek.outputs.gonder == 'true' && hashFiles('push-sent.flag') != ''
        uses: actions/cache/save@v4
        with:
          path: push-sent.flag
          key: push-sent-${{ steps.gun.outputs.tarih }}
