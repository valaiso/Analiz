name: Veri güncelle ve yayınla

# TEFAS fiyatlarını her işlem günü sabah çeker, siteyi üretir ve GitHub Pages'e
# yayınlar. Ham veri depoya commit edilmez; iki çalıştırma arasında Actions
# cache'inde saklanır. Böylece depo küçük kalır ve her gün yalnızca eksik
# günler çekilir.

on:
  schedule:
    # NE ZAMAN AÇIKLANIYOR?
    # Fon pay fiyatları borsa kapanışından sonra hesaplanır ve ertesi işlem
    # günü sabahı Takasbank sistemine tanımlanır. TEFAS Uygulama Esasları
    # MADDE 13(2): "Saat 09:30 itibariyle fiyat bilgisi tanımlanmayan fonların
    # operatör üyesine elektronik ortamda uyarı mesajı gönderilir." Talimat
    # kabulü de 09:00'da başlıyor (MADDE 11). Yani günün fiyatı 09:00-09:30
    # (TR) arasında yayında oluyor. Türkiye tüm yıl UTC+3'tür, saatler kaymaz.
    #
    # NEDEN TEK BİR CRON YETMİYOR?
    # GitHub zamanlanmış işleri "en iyi çaba" ile tetikliyor: tek bir cron
    # 40 dakikaya varan gecikmeyle başlayabiliyor, hatta atlanabiliyor. Tek
    # sefere güvenmek yerine sabah boyunca yokluyoruz; her yoklama önce
    # `kontrol` işini çalıştırıyor, bu iş saniyeler sürüyor ve yalnızca
    # gerçekten yeni fiyat varsa tam derlemeyi tetikliyor.
    #
    # 06:00-08:50 UTC = 09:00-11:50 TR, 10 dakikada bir.
    - cron: '*/10 6-8 * * 1-5'
    # 16:00 UTC = 19:00 TR - doğrulama turu: TEFAS gün içinde fiyat düzeltmesi
    # yayımlarsa ya da sabahki tur tümüyle atlandıysa aynı gün yakalanır.
    - cron: '0 16 * * 1-5'
  workflow_dispatch:
    inputs:
      full:
        description: 'Veriyi baştan çek (cache yok sayılır)'
        type: boolean
        default: false
      years:
        description: 'Kaç yıllık geçmiş tutulsun'
        default: '3'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/**'
      - 'scripts/**'
      - '.github/workflows/update-data.yml'

permissions:
  contents: read
  pages: write
  id-token: write

# Aynı anda tek yayın çalışsın; sıradaki çalışma öncekini iptal etmesin.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Ucuz ön kontrol: sabah yoklamaları 10 dakikada bir çalıştığı için tam
  # derlemeyi (~5 dk) her seferinde tetiklemek israf olur. Bu iş saniyeler
  # içinde "yayındaki site zaten bugünün fiyatında mı" ve "TEFAS bugünün
  # fiyatını yayımlamış mı" sorularını yanıtlar; ancak ikisi de uygunsa
  # derleme başlar. Tatil günlerinde hiç derleme yapılmaz.
  kontrol:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      run: ${{ steps.karar.outputs.run }}
      reason: ${{ steps.karar.outputs.reason }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: karar
        env:
          SITE_URL: ${{ format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
          PYTHONIOENCODING: utf-8
        run: |
          python scripts/check_fresh.py \
            --site-url "${SITE_URL}" \
            ${{ github.event.schedule == '0 16 * * 1-5' && '--force-refresh' || '' }}
      - name: Kararı özete yaz
        env:
          REASON: ${{ steps.karar.outputs.reason }}
        run: echo "$REASON" >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: kontrol
    # Zamanlanmış turlarda yalnızca yeni fiyat varsa derle; elle tetikleme ve
    # kod değişikliği (push) her hâlükârda yayınlanmalı.
    if: ${{ github.event_name != 'schedule' || needs.kontrol.outputs.run == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Ham fiyat deposu (SQLite) çalışmalar arasında cache'te taşınır.
      # Anahtar her çalışmada yeni olur; restore-keys en son kaydı geri yükler.
      - name: Veri deposunu geri yükle
        if: ${{ github.event.inputs.full != 'true' }}
        uses: actions/cache/restore@v4
        with:
          path: data
          key: tefas-db-${{ github.run_id }}
          restore-keys: |
            tefas-db-

      # Bozuk bir JS dosyası sessizce yayına gitmesin: tarayıcı hatayı yalnızca
      # çalışma anında gösterir, bu adım ise derlemeyi hemen durdurur.
      - name: Kaynak kodu sözdizimi denetimi
        run: |
          set -e
          mkdir -p /tmp/esm
          for f in assets/js/*.js assets/js/views/*.js; do
            cp "$f" "/tmp/esm/$(basename "${f%.js}").mjs"
          done
          for f in /tmp/esm/*.mjs; do node --check "$f"; done
          python -c "import json,pathlib; [json.loads(pathlib.Path(p).read_text(encoding='utf-8')) for p in pathlib.Path('.').glob('*.json')]"
          echo "$(ls /tmp/esm/*.mjs | wc -l) JS modülü ve JSON dosyaları geçerli"

      - name: TEFAS verisini güncelle ve siteyi üret
        env:
          TEFAS_YEARS: ${{ github.event.inputs.years || '3' }}
          # İsteğe bağlı: TÜFE (enflasyon) kıyası için ücretsiz EVDS anahtarı.
          EVDS_API_KEY: ${{ secrets.EVDS_API_KEY }}
          PYTHONIOENCODING: utf-8
        run: |
          python scripts/update.py \
            --years "${TEFAS_YEARS}" \
            --delay 3.0 \
            ${{ github.event.inputs.full == 'true' && '--full' || '' }}

      - name: Veri deposunu kaydet
        uses: actions/cache/save@v4
        if: always()
        with:
          path: data
          key: tefas-db-${{ github.run_id }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
